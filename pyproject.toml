[project]
name = "canvas-sync"
version = "0.1.0"
description = "Keep a Canvas LMS course in sync with a folder of Markdown/YAML files"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pydantic>=2.6",
    "ruamel.yaml>=0.18",
    "python-frontmatter>=1.1",
    "markdown-it-py>=3",
    "mdit-py-plugins>=0.4",
    "pygments>=2.17",
    "pypandoc>=1.13",
    "httpx>=0.27",
]

[project.scripts]
canvas = "canvas_sync.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "pyright>=1.1.380",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/canvas_sync"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a real Canvas sandbox course (CANVAS_SANDBOX_URL/COURSE, CANVAS_TOKEN)"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["*.md"]  # CONTRACTS.md code blocks are prose, not formatted code

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
strict = ["src"]

